<!-- kj_comment: comment box of the bootstrap style, comment.js posts and deletes the comments without reloading the page -->
<section id="kj-comments" class="card kj-comments" aria-labelledby="kj-comments-title"
    data-confirm-delete="{olang.KJC_DELETE_CONFIRM}" data-error="{lang.ERROR_TRY_AGAIN}"
    data-alert-success="alert alert-success" data-alert-danger="alert alert-danger">

    <div class="card-header kj-comments-header">
        <svg class="kj-icon text-primary" viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path d="M2.5 2.5h11a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H6l-3.5 3v-3a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M4.5 5.5h7M4.5 8.5h4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <h2 class="kj-comments-title" id="kj-comments-title">{olang.COMNTS}</h2>
        <span class="badge badge-pill badge-primary kj-comments-count" data-kj-count>{kj_comments_count}</span>
    </div>

    <div class="card-body kj-comments-compose">
        <IF NAME="kj_comment_user">
        <form method="post" action="{kj_comment_add_action}" class="kj-compose" data-kj-form>
            <span class="kj-avatar" style="--kj-hue: {kj_comment_user_hue}" aria-hidden="true">{kj_comment_user_initial}</span>

            <div class="kj-compose-body">
                <label for="kj-comment-text" class="sr-only">{olang.ADD_COMNT}</label>
                <textarea id="kj-comment-text" name="comment" class="form-control" rows="3" maxlength="{kj_comment_max}" placeholder="{olang.KJC_PLACEHOLDER}" dir="auto" required></textarea>

                <div class="kj-compose-footer">
                    <small class="text-muted">
                        <span class="d-none d-md-inline">{olang.KJC_SHORTCUT} &middot; </span><span class="kj-counter" dir="ltr" data-kj-counter>0 / {kj_comment_max}</span>
                    </small>
                    <button type="submit" name="submit" value="1" class="btn btn-primary kj-submit">
                        <span class="spinner-border spinner-border-sm kj-spinner" aria-hidden="true"></span>
                        <svg class="kj-icon kj-submit-icon kj-send-icon" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M14.5 1.5 1.5 7l5 2.5 2.5 5z M14.5 1.5l-8 8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
                        <span>{olang.KJC_SEND}</span>
                    </button>
                </div>

                <input type="hidden" name="file_id" value="{kj_comment_file_id}">
                {kj_comment_form_key}
            </div>
        </form>
        <ELSE>
        <div class="kj-guest">
            <span class="text-muted">{olang.NO_4_GUEST}</span>
            <a href="{kj_comment_login_link}" class="btn btn-primary btn-sm" rel="nofollow">{lang.LOGIN}</a>
        </div>
        </IF>

        <div class="kj-status" data-kj-status role="status" aria-live="polite"></div>
    </div>

    <ul class="list-group list-group-flush kj-comment-list" data-kj-list>
        {kj_comment_list}
    </ul>
</section>
