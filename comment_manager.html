<!-- Breadcrumbs -->
<ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="./">{lang.R_CPINDEX}</a></li>
    <li class="breadcrumb-item active">{olang.R_COMMENT_MANAGER}</li>
</ol>

<IF NAME="no_results">

<div class="card mb-3">
    <div class="card-body text-center text-muted py-5">
        <i class="fa fa-comments-o fa-3x mb-3 d-block" aria-hidden="true"></i>
        {lang.NOTHING}
    </div>
</div>

<ELSE>

<div class="card mb-3">
    <div class="card-header d-flex justify-content-between align-items-center">
        <div>
            <i class="fa fa-comments" aria-hidden="true"></i>
            <strong>{olang.COMNTS}</strong>
            <small class="text-muted d-none d-md-inline">&nbsp;&middot;&nbsp;{olang.KJC_ADMIN_HINT}</small>
        </div>
        <span class="badge badge-pill badge-primary">{num_rows}</span>
    </div>

    <div class="table-responsive">
        <table class="table table-hover mb-0">
            <thead class="thead-light">
                <tr>
                    <th scope="col">{lang.USER}</th>
                    <th scope="col">{olang.COMNT}</th>
                    <th scope="col">{lang.FILE}</th>
                    <th scope="col">{lang.TIME}</th>
                    <th scope="col"><span class="sr-only">{lang.DELETE}</span></th>
                </tr>
            </thead>
            <tbody>
                <LOOP NAME="comments">
                <tr>
                    <td class="align-middle text-nowrap">
                        <span class="d-inline-flex align-items-center justify-content-center rounded-circle font-weight-bold" style="width: 2rem; height: 2rem; {{avatar_style}}" aria-hidden="true">{{initial}}</span>
                        <a target="_blank" href="{{user_link}}">{{name}}</a>
                    </td>
                    <td class="align-middle" style="min-width: 16rem"><span dir="auto" title="{{comment}}">{{excerpt}}</span></td>
                    <td class="align-middle"><a target="_blank" href="{{file_link}}" class="d-inline-block text-truncate align-middle" style="max-width: 14rem" title="{{file_name}}">{{file_name}}</a></td>
                    <td class="align-middle text-nowrap text-muted"><small title="{{full_time}}">{{time}}</small></td>
                    <td class="align-middle text-(lang.DIR==ltr?right:left)">
                        <form action="{delFormAction}" method="POST" class="d-inline" data-confirm="{olang.KJC_DELETE_CONFIRM}" onsubmit="return confirm_form(this.getAttribute('data-confirm'));">
                            {form_key}
                            <input type="hidden" name="file_id" value="{{file_id}}">
                            <input type="hidden" name="admin_form" value="1">
                            <input type="hidden" name="comment_id" value="{{id}}">
                            <button type="submit" name="del" value="1" class="btn btn-sm btn-outline-danger text-nowrap">
                                <i class="fa fa-trash" aria-hidden="true"></i> {lang.DELETE}
                            </button>
                        </form>
                    </td>
                </tr>
                </LOOP>
            </tbody>
        </table>
    </div>
</div>

<!-- pagination -->
{page_nums}
<div class="clearfix"></div>

</IF>
