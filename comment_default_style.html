<!-- kj_comment: comment box of the default style, comment.js posts and deletes the comments without reloading the page -->
<section id="kj-comments" class="kj-comments" aria-labelledby="kj-comments-title"
    data-confirm-delete="{olang.KJC_DELETE_CONFIRM}" data-error="{lang.ERROR_TRY_AGAIN}"
    data-alert-success="notice kj-msg" data-alert-danger="notice notice-error kj-msg">

    <!-- title -->
    <h2 class="kj-title" id="kj-comments-title">{olang.COMNTS} <span class="kj-count" data-kj-count>{kj_comments_count}</span></h2>
    <!-- @end-title -->

    <IF NAME="kj_comment_user">
    <!-- new comment -->
    <form method="post" action="{kj_comment_add_action}" class="box kj-compose" data-kj-form>
        <div class="box-title">{olang.ADD_COMNT}</div>

        <div class="box-body kj-compose-body">
            <span class="kj-avatar" style="--kj-hue: {kj_comment_user_hue}" aria-hidden="true">{kj_comment_user_initial}</span>

            <div class="kj-compose-field">
                <label for="kj-comment-text" class="visually-hidden">{olang.ADD_COMNT}</label>
                <textarea id="kj-comment-text" name="comment" rows="4" maxlength="{kj_comment_max}" placeholder="{olang.KJC_PLACEHOLDER}" dir="auto" required></textarea>

                <div class="kj-compose-footer">
                    <span class="kj-hint">
                        <span class="kj-shortcut">{olang.KJC_SHORTCUT} &middot; </span><span class="kj-counter" dir="ltr" data-kj-counter>0 / {kj_comment_max}</span>
                    </span>
                    <button type="submit" name="submit" value="1" class="btn btn-primary">
                        <img src="{STYLE_PATH}images/spin.gif" class="kj-spinner" width="16" height="16" alt="">
                        <i class="fa-solid fa-paper-plane icon-flip kj-submit-icon" aria-hidden="true"></i>
                        <span>{olang.KJC_SEND}</span>
                    </button>
                </div>

                <input type="hidden" name="file_id" value="{kj_comment_file_id}">
                {kj_comment_form_key}
            </div>
        </div>
    </form>
    <!-- @end-new-comment -->
    <ELSE>
    <!-- guests -->
    <div class="notice kj-guest">
        <img src="{STYLE_PATH}images/info.png" width="29" height="29" alt="">
        <div class="notice-body">{olang.NO_4_GUEST}</div>
        <a href="{kj_comment_login_link}" class="btn btn-primary" rel="nofollow">{lang.LOGIN}</a>
    </div>
    <!-- @end-guests -->
    </IF>

    <div class="kj-status" data-kj-status role="status" aria-live="polite"></div>

    <!-- comments -->
    <ul class="kj-list" data-kj-list>
        {kj_comment_list}
    </ul>
    <!-- @end-comments -->
</section>
